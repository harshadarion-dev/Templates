<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Actura - 404 Page Not Found</title>
    <style>
        /* RESET & GLOBAL STYLES (Actura Design System) */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        :root {
            --primary-color: #ffcc00;
            --text-dark: #1a1a1a;
            --text-light: #ffffff;
            --bg-dark: #1b1b1b;
            --bg-light: #f9f9f9;
            --grey-text: #888888;
            --border-color: #eeeeee;
            --font-main: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            font-family: var(--font-main);
            color: var(--text-dark);
            background-color: var(--text-light);
            line-height: 1.6;
            overflow-x: hidden;
        }

        .container { max-width: 1200px; margin: 0 auto; padding: 0 20px; }
        a { text-decoration: none; color: inherit; transition: all 0.3s ease; }
        svg { display: block; }
        .flex-center { display: flex; align-items: center; gap: 8px; }

        /* HEADER */
        .site-header { position: absolute; width: 100%; z-index: 100; color: var(--text-light); }
        .top-bar {
            display: flex; justify-content: space-between; padding: 12px 40px;
            background: rgba(0, 0, 0, 0.4); font-size: 0.8rem;
            border-bottom: 1px solid rgba(255,255,255,0.1);
        }
        .contact-info, .social-icons { display: flex; align-items: center; gap: 20px; }
        .social-icons a:hover { color: var(--primary-color); }
        .main-nav {
            display: flex; justify-content: space-between; align-items: center;
            padding: 20px 40px; background: rgba(0, 0, 0, 0.2);
        }
        .logo { font-size: 1.5rem; font-weight: 700; letter-spacing: 2px; }
        .nav-links { list-style: none; display: flex; gap: 30px; font-size: 0.9rem; }
        .nav-links li a:hover { color: var(--primary-color); }
        .search-icon { cursor: pointer; transition: color 0.3s; }
        .search-icon:hover { color: var(--primary-color); }

        /* 404 ERROR SECTION */
        .error-section {
            position: relative;
            height: 100vh;
            min-height: 700px;
            background-image: url('https://images.unsplash.com/photo-1508450859948-4e04fabaa4ea?auto=format&fit=crop&w=1920&q=80');
            background-size: cover;
            background-position: center;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
        }

        .error-overlay {
            position: absolute; top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(27, 27, 27, 0.85); /* Heavy dark overlay */
            z-index: 1;
        }

        .error-content {
            position: relative;
            z-index: 10;
            color: var(--text-light);
            max-width: 700px;
            padding: 0 20px;
        }

        /* Stylized "404" */
        .error-code {
            font-size: 10rem;
            font-weight: 800;
            line-height: 1;
            margin-bottom: 10px;
            color: transparent;
            -webkit-text-stroke: 2px var(--primary-color);
            position: relative;
            display: inline-block;
        }
        
        /* Inner solid zero for contrast */
        .error-code span {
            color: var(--primary-color);
            -webkit-text-stroke: 0;
        }

        .error-title {
            font-size: 2.5rem;
            font-weight: 700;
            margin-bottom: 20px;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .error-text {
            font-size: 1.1rem;
            color: #cccccc;
            margin-bottom: 40px;
            max-width: 500px;
            margin-left: auto;
            margin-right: auto;
        }

        .quote-line-center {
            width: 40px;
            height: 4px;
            background-color: var(--primary-color);
            margin: 0 auto 30px auto;
        }

        .btn-primary {
            background-color: var(--primary-color);
            color: var(--text-dark);
            border: none;
            display: inline-flex;
            align-items: center;
            gap: 10px;
            padding: 16px 35px;
            font-weight: 700;
            cursor: pointer;
            font-size: 1rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: background 0.3s;
        }

        .btn-primary:hover {
            background-color: #e6b800;
        }

        /* RESPONSIVE */
        @media (max-width: 900px) {
            .top-bar, .nav-links { display: none; }
            .error-code { font-size: 7rem; }
            .error-title { font-size: 2rem; }
        }
    </style>
</head>
<body>

    <header class="site-header">

                    +1 234 567 89 (USA)

    </header>

    <section class="error-section">
        <div class="error-overlay"></div>
        <div class="error-content">
            <div class="error-code">4<span>0</span>4</div>
            <div class="quote-line-center"></div>
            <h1 class="error-title">Page Not Found</h1>
            <p class="error-text">Looks like we haven't built this page yet, or the structural link has been demolished. Let's get you back to solid ground.</p>
            
            <a href="index.html" class="btn-primary">

                Return to Homepage

    </section>

</body>
</html>
